<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mail</title>
    </head>
    <body>
        <aside id="mail-sidebar"></aside>
        <main id="mail-main">
            <div id="mail-menubar"></div>
            <div id="mail-toolbar">
                <section id="mail-toolbar-section-1">
                    <button id="mail-compose-button" aria-label="Compose Email">Compose</button>
                    <button id="mail-refresh-button" aria-label="Refresh Mail">Refresh</button>
                </section>

                <section id="mail-toolbar-section-2">
                    <button id="mail-spam-button" aria-label="Mark as Spam">Spam</button>
                    <button id="mail-delete-button" aria-label="Delete Email">Delete</button>
                    <button id="mail-archive-button" aria-label="Archive Email">Archive</button>
                </section>
                
            </div>
            <div id="mail-list"></div>
            <div id="mail-viewport"></div>
            <div id="mail-compose" aria-label="Compose Email" aria-expanded="false"></div>
        </main>
    </body>
</html>
